{% load i18n %}
<div class="relative"
     x-data="{ open: false }"
     @click.outside="open = false">

  <button @click="open = !open"
          type="button"
          class="relative flex items-center justify-center w-9 h-9 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
          aria-label="{% trans 'Notificaciones' %}">

    <span id="notifications-badge"
          hx-get="{% url 'notifications_unread_count' %}"
          hx-trigger="load, every 30s"
          hx-swap="innerHTML"
          class="absolute -top-1 -right-1">
    </span>

    <span class="material-symbols-outlined md-18 text-base-600 dark:text-base-300">notifications</span>

  </button>

  <div id="notifications-dropdown-container"
       hx-get="{% url 'notifications_unread_list' %}"
       hx-trigger="click from:previous button"
       hx-swap="innerHTML"
       x-show="open"
       style="display:none"
       class="absolute right-0 top-11 z-50 w-80">
  </div>
</div>
