{% load i18n %}
<div class="mt-6 flex justify-center">
    <form action="{% url 'set_language' %}" method="post" class="flex items-center gap-2">
        {% csrf_token %}
        <input name="next" type="hidden" value="{{ request.get_full_path }}">
        <span class="material-symbols-outlined text-base text-gray-400">language</span>
        <select name="language"
                onchange="this.form.submit()"
                class="text-sm border-0 bg-transparent text-gray-500 dark:text-gray-400 cursor-pointer focus:outline-none focus:ring-0 pr-6">
            {% get_current_language as current_lang %}
            {% get_available_languages as languages %}
            {% for code, name in languages %}
                <option value="{{ code }}" {% if code == current_lang %}selected{% endif %}>
                    {{ name }}
                </option>
            {% endfor %}
        </select>
    </form>
</div>
