{% extends 'unfold/layouts/unauthenticated.html' %}
{% load i18n %}

{% block content %}
    <h1 class="text-2xl font-semibold text-gray-900 dark:text-white mb-2">{% trans "Password updated!" %}</h1>
    <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">
        {% trans "Your password was saved successfully. You can now log in." %}
    </p>

    <div class="text-center">
        <a href="/admin/login/"
           class="w-full inline-flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500">
            {% trans "Log in" %}
        </a>
    </div>
    {% include "partials/language_selector.html" %}
{% endblock %}
